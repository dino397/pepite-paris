name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/setup-dev-environment-rLAWA']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/pepite-paris/
        env:
          VITE_SUPABASE_URL: "https://ehcvbedadodrgvbbzsea.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoY3ZiZWRhZG9kcmd2YmJ6c2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODU1MTUsImV4cCI6MjA4OTg2MTUxNX0.Iv2z-Ha0tfzk-66v1uTe6Wu0eYWlel0RWaKQ8b38eq4"
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
